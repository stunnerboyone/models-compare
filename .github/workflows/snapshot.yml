name: snapshot

on:
  schedule:
    # 06:15 UTC daily. Off-the-hour on purpose — scheduled jobs at :00 sit in
    # a long queue on GitHub's shared runners.
    - cron: "15 6 * * *"
    # Second attempt. The dataset-server sometimes reindexes for longer than
    # the in-process retries cover; a run that finds no change is a no-op.
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # The failure alert reads this workflow's previous run to tell a one-off
  # Hugging Face 5xx from a second failure in a row.
  actions: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Every step that can fail names itself in failed-step.txt and tees its
      # output to step.log, both overwritten as the job moves on. Whatever is
      # in them when the job dies belongs to the step that killed it, which is
      # what the failure alert reports. pipefail keeps the real exit code —
      # tee always exits 0.
      - name: Fetch and normalize
        id: snap
        run: |
          echo "Fetch and normalize" > failed-step.txt
          set -o pipefail
          node src/snapshot.js 2>&1 | tee step.log

      - name: Commit
        id: commit
        run: |
          echo "Commit" > failed-step.txt
          set -o pipefail
          # Braced so the whole step, git's stderr included, lands in step.log.
          # The group is a subshell, so `exit 0` ends the group, not the step.
          {
            if [ -z "$(git status --porcelain data/)" ]; then
              echo "nothing to commit"
              echo "committed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git config user.name  "llm-data bot"
            git config user.email "actions@github.com"
            git add data/
            git commit -m "data: snapshot $(date -u +%F)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee step.log

      # Only fires when the job failed — a silent broken cron is the whole
      # thing we are trying to avoid. Carries the failing step and the tail of
      # its output so the message answers "why" without opening Actions.
      # continue-on-error so an unreachable Telegram cannot add a second,
      # misleading failure on top of the real one.
      #
      # Exception: a Hugging Face 5xx (the dataset-server reindexing) usually
      # clears by the next cron, so the first one stays silent. It alerts once
      # it is the second failed run in a row, or once data/latest.json is more
      # than 3 days old by generated_at — whichever comes first. Every other
      # error alerts at once, as before. If either check cannot be answered
      # (API down, unreadable file), it alerts: better noisy than blind.
      - name: Alert on failure
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          step=$(cat failed-step.txt 2>/dev/null || true)

          reason=""
          # Only the fetch step talks to Hugging Face, and only its final
          # FAILED line counts: retries that recovered also log "HTTP 5xx".
          if [ "$step" = "Fetch and normalize" ] \
             && grep -qE 'FAILED: arena: .*HTTP 5[0-9]{2}' step.log 2>/dev/null; then
            # status=completed leaves out this run, which is still going; the
            # concurrency group means nothing else of ours is in between.
            prev=$(gh api \
              "repos/${REPO}/actions/workflows/snapshot.yml/runs?status=completed&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "none"' 2>/dev/null || echo unknown)
            age_days=$(node -e '
              const g = Date.parse(require("./data/latest.json").generated_at);
              if (!Number.isFinite(g)) process.exit(1);
              console.log(((Date.now() - g) / 86400000).toFixed(1));
            ' 2>/dev/null || echo unknown)
            echo "HF 5xx: previous run=${prev}, latest.json age=${age_days}d"

            if [ "$prev" = "failure" ]; then
              reason="HF 5xx: 2nd failed run in a row"
            elif [ "$age_days" = "unknown" ] || [ "$prev" = "unknown" ]; then
              reason="HF 5xx: could not check previous run / data age (prev=${prev}, age=${age_days}d)"
            elif awk -v a="$age_days" 'BEGIN { exit !(a > 3) }'; then
              reason="HF 5xx: data/latest.json is ${age_days}d old"
            else
              echo "first HF 5xx and data is ${age_days}d old — not alerting"
              exit 0
            fi
          fi

          {
            echo "llm-data snapshot FAILED"
            echo "step: ${step:-unknown}"
            [ -n "$reason" ] && echo "$reason"
            if [ -s step.log ]; then
              echo "--- last 15 lines ---"
              # 1500 bytes keeps header + log + link well inside Telegram's
              # 4096-char limit. iconv -c drops the half character that
              # cutting on a byte count can leave behind.
              tail -n 15 step.log | tail -c 1500 | iconv -f utf-8 -t utf-8 -c
            else
              echo "(no output captured)"
            fi
            echo "${RUN_URL}"
          } > tg-alert.txt
          # text@file: curl reads and urlencodes the file, so newlines survive
          # and nothing in the log can break out of shell quoting.
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text@tg-alert.txt" >/dev/null || true

      - name: Notify on change
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Through the environment, not interpolated into the command: the
          # summary is free text from the snapshot run.
          SUMMARY: ${{ steps.snap.outputs.summary }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          printf 'llm-data: new snapshot committed. %s\n%s\n' \
            "${SUMMARY:-routine update}" "$RUN_URL" | head -c 4000 > tg-note.txt
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text@tg-note.txt" >/dev/null || true
