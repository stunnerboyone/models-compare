name: webflow-sync

on:
  schedule:
    # One sync per snapshot run, each 30 minutes behind its pair, so the
    # sync picks up whatever that snapshot job just committed.
    # Pairs with snapshot's 06:15 run.
    - cron: "45 6 * * *"
    # Pairs with snapshot's 09:15 retry. Without this, data that only
    # arrives on the second attempt would sit unsynced until the next
    # morning. A run with nothing new is a no-op.
    - cron: "45 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webflow-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The MISS and SUGGEST reminders are deduped across runs, so the notifier
      # has to know what it reported last time. Cache entries are immutable, so
      # each run saves under its own key (miss-state-<hash of the missed set>-
      # <run>) and restores the newest one by prefix. The hash alone cannot be
      # the key: the same set on the next run would collide with an entry that
      # can never be overwritten, and the SUGGEST half of the state would be
      # stuck. A miss on the restore (first run, or a 7-day eviction) just
      # means one extra full list, never a missing one.
      - name: Restore reminder state
        uses: actions/cache/restore@v4
        with:
          path: .miss-state.json
          key: miss-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: miss-state-

      - name: Push snapshot to Webflow
        env:
          # No .env file exists in CI — that's why the script uses
          # --env-file-if-exists. The token comes from the runner env.
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        # tee keeps the Actions log identical while capturing the output for
        # the failure alert. pipefail preserves node's exit code so a sync
        # failure still fails the job (tee itself always exits 0).
        # --report is what the notifier formats from; stdout is for humans.
        run: |
          echo "Push snapshot to Webflow" > failed-step.txt
          set -o pipefail
          node --env-file-if-exists=.env src/webflow-sync.js \
            --report sync-report.json 2>&1 | tee step.log

      # /compare/{pair} pages carry a static, server-rendered comparison table
      # (SEO) built from plain text fields on each Compares item. Refresh them
      # from Model Versions right after the sync, so the table never trails
      # the widget. A failure here fails the job and fires the alert below.
      - name: Refresh compare tables
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: |
          echo "Refresh compare tables" > failed-step.txt
          set -o pipefail
          node --env-file-if-exists=.env scripts/compares-table.mjs --apply 2>&1 | tee step.log

      # Stay quiet on the "nothing to update" runs — that's most of them.
      # Ping only when the sync actually changed something (updated > 0) or
      # when a CMS item's arena-model-name has disappeared from the snapshot
      # (missed > 0), which usually means a model was renamed or dropped from
      # the leaderboard and the page will otherwise show stale numbers until
      # someone notices.
      #
      # Same for a vendor top-N that has moved on without the CMS (SUGGEST):
      # the sync cannot fix that one by patching, so saying it is the whole
      # point. Nothing is created or replaced automatically.
      #
      # The message is built from sync-report.json rather than scraped out of
      # stdout: the counts and the per-item detail come from the same source
      # the script actually wrote, so a format change in the log cannot turn
      # the alert into "MISS: 1 item(s)" with no clue which item.
      #
      # On top of that, two checks that always send:
      #   CRITICAL — nothing matched, or at least half the CMS items missed.
      #   STALE    — the site's arena-date-label trails latest.json's
      #              published_at by more than 7 days, whatever the reason.
      # An unchanged MISS set gets one short line on the morning run only.
      - name: Build notification
        id: notify
        if: success()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The cron line that fired, empty on workflow_dispatch. Tells the
          # morning run apart from the 09:45 retry.
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Build notification" > failed-step.txt
          set -o pipefail
          node --input-type=module - <<'NODE' 2>&1 | tee step.log
          import { readFileSync, writeFileSync, appendFileSync } from "node:fs";
          import { createHash } from "node:crypto";

          const REPORT = "sync-report.json";
          const STATE = ".miss-state.json";
          const OUT = "tg-message.txt";

          // Telegram's hard cap is 4096; 4000 leaves room for its own framing.
          const LIMIT = 4000;
          const LIST_CAP = 10;
          const CANDIDATES_SHOWN = 3;
          // SUGGEST is a standing condition: the same set every day until a
          // human edits the CMS. Repeat the same set at most this often.
          const REMIND_AFTER_MS = 3 * 24 * 60 * 60 * 1000;
          // The morning cron is the one run a day allowed to say "MISS
          // unchanged"; the 09:45 retry and manual runs stay quiet about it.
          // Must match the first cron line under `on.schedule` above.
          const MORNING_CRON = "45 6 * * *";
          const isMorning = process.env.EVENT_SCHEDULE === MORNING_CRON;

          const report = JSON.parse(readFileSync(REPORT, "utf8"));
          const missedItems = report.missed_items ?? [];
          const updatedItems = report.updated_items ?? [];
          const suggestions = report.suggestions ?? [];
          const missedKeys = missedItems.map((m) => m.key).sort();
          // vendor:key — the same model can be suggested for two vendor pages
          // (ChatGPT and Copilot share an org), and those are two separate
          // things to fix.
          const suggestKeys = suggestions
            .flatMap((s) => (s.add ?? []).map((a) => `${s.vendor}:${a.key}`))
            .sort();

          let state = {};
          try {
            state = JSON.parse(readFileSync(STATE, "utf8"));
          } catch {
            // No cache hit, or a state file this version cannot read. Either
            // way: treat the current findings as new and report them.
          }

          const now = new Date().toISOString();

          // MISS: the full list goes out only when the *set* changes, which
          // the hash of the sorted keys answers in one comparison. A state
          // file from before the hash existed still has the keys, so hash
          // those rather than re-announcing a set that was already sent.
          const hashKeys = (keys) =>
            createHash("sha256").update(keys.join("\n")).digest("hex").slice(0, 16);
          const missHash = missedKeys.length > 0 ? hashKeys(missedKeys) : null;
          const savedMissHash =
            state.miss_hash ??
            (Array.isArray(state.keys) && state.keys.length > 0
              ? hashKeys([...state.keys].sort())
              : null);
          const missChanged = missHash !== null && missHash !== savedMissHash;
          // "since" is when this exact set first appeared, not when it was
          // last mentioned. Older state files only know last_notified, which
          // for them was the same moment.
          const missSince =
            missHash === null
              ? null
              : missChanged
                ? now
                : (state.miss_since ?? state.last_notified ?? now);
          const missUnchangedLine = missHash !== null && !missChanged && isMorning;

          // SUGGEST keeps its own 3-day reminder clock, independent of MISS.
          function decide(currentKeys, savedKeys, savedAt) {
            const sinceLast = Number.isFinite(Date.parse(savedAt ?? ""))
              ? Date.now() - Date.parse(savedAt)
              : Infinity;
            const sameSet =
              Array.isArray(savedKeys) &&
              savedKeys.length === currentKeys.length &&
              savedKeys.every((k, i) => k === currentKeys[i]);
            return {
              sinceLast,
              suppress: currentKeys.length > 0 && sameSet && sinceLast < REMIND_AFTER_MS,
            };
          }
          const suggest = decide(suggestKeys, state.suggest_keys, state.suggest_notified);

          // Denominator is every CMS item. matched was the old denominator,
          // which is how a fully broken sync read as a harmless "0 of 0".
          // Older reports without cms_items fall back to the old behaviour.
          const total = report.cms_items ?? report.matched;
          const critical =
            report.matched === 0 || (total > 0 && report.missed * 2 >= total);

          const siteLabels = report.site_date_labels ?? [];
          const siteLabelText =
            siteLabels.length === 0
              ? "—"
              : siteLabels.length === 1
                ? siteLabels[0].label
                : siteLabels.map((l) => `${l.label} (${l.count})`).join(", ");

          // Header lines survive truncation, so everything that answers "is
          // the site broken" goes here, ahead of the per-item detail.
          const head = [];
          if (critical) {
            head.push(`🚨 CRITICAL: сайт не оновлюється — matched ${report.matched} of ${total}`);
            head.push(
              `Arena published_at: ${report.arena_published_at ?? "—"}, на сайті: ${siteLabelText}`
            );
          }
          head.push(`llm-data webflow-sync: updated ${report.updated} of ${total}`);
          for (const l of report.stale?.labels ?? []) {
            head.push(`⚠️ STALE: ${l.count} items show ${l.label}`);
          }

          const lines = [];

          for (const item of updatedItems.slice(0, LIST_CAP)) {
            lines.push(`• ${item.name}: ${(item.fields ?? []).join(", ")}`);
          }
          if (updatedItems.length > LIST_CAP) {
            lines.push(`+${updatedItems.length - LIST_CAP} more`);
          }

          if (missChanged) {
            lines.push("MISS (CMS item no longer in Arena):");
            for (const item of missedItems.slice(0, LIST_CAP)) {
              lines.push(`• ${item.name} [${item.key}]`);
              const candidates = item.candidates ?? [];
              if (candidates.length > 0) {
                // "; " not ", ": each candidate already contains a comma.
                lines.push(`  candidates: ${candidates.slice(0, CANDIDATES_SHOWN).join("; ")}`);
              }
              lines.push("  → update Arena model name in CMS or replace the item");
            }
            if (missedItems.length > LIST_CAP) {
              lines.push(`+${missedItems.length - LIST_CAP} more`);
            }
          } else if (missUnchangedLine) {
            lines.push(`MISS unchanged: ${missedKeys.length} items (since ${missSince.slice(0, 10)})`);
          }

          // Same wording as the script's SUGGEST block, so the alert and the
          // run log read the same. The action is identical for every line, so
          // the hint goes once at the end rather than under each model.
          if (suggestions.length > 0 && !suggest.suppress) {
            lines.push("SUGGEST (newer models in vendor top-N not in CMS):");
            const rank = (r) => (r != null ? `rank ${r}` : "unranked");
            const rows = suggestions.flatMap((s) =>
              (s.add ?? []).map((a) => {
                const weakest = (s.replace_candidates ?? [])[0];
                const against = weakest
                  ? ` — weakest in CMS: ${weakest.name} (${rank(weakest.rank)})`
                  : "";
                return `• ${s.vendor}: + ${a.key} (${rank(a.rank)})${against}`;
              })
            );
            lines.push(...rows.slice(0, LIST_CAP));
            if (rows.length > LIST_CAP) lines.push(`+${rows.length - LIST_CAP} more`);
            lines.push("  → add the model version in CMS, or swap it for the weakest");
          }

          const runUrl = process.env.RUN_URL ?? "";

          // Drop detail lines, never the header block or the run link — the
          // link is what a truncated message is read with.
          function clamp(headLines, body, link) {
            const text = [...headLines, ...body, link].join("\n");
            if (text.length <= LIMIT) return text;
            const tail = `… truncated, see the run log\n${link}`;
            const kept = [];
            let size = headLines.join("\n").length + 1 + tail.length;
            for (const line of body) {
              if (size + line.length + 1 > LIMIT) break;
              kept.push(line);
              size += line.length + 1;
            }
            return [...headLines, ...kept, tail].join("\n");
          }

          // CRITICAL and STALE always go out: they describe the site, not
          // a finding someone has already been told about. Everything else
          // goes out only when it is news.
          const reasons = [];
          if (critical) reasons.push("critical");
          if (report.stale) reasons.push("stale");
          if (report.updated > 0) reasons.push("updated");
          if (missChanged) reasons.push("miss changed");
          if (missUnchangedLine) reasons.push("miss unchanged (morning)");
          if (suggestions.length > 0 && !suggest.suppress) reasons.push("suggest");

          const days = (ms) => (ms / 86400000).toFixed(1);

          if (reasons.length > 0) {
            writeFileSync(OUT, clamp(head, lines, runUrl));
            console.log(`notification queued: ${reasons.join(", ")}`);
          } else {
            const held = [];
            if (missHash !== null) {
              held.push(`${missedKeys.length} missed key(s) unchanged since ${missSince}, not the morning run`);
            }
            if (suggest.suppress) {
              held.push(
                `${suggestKeys.length} suggestion(s), last sent ${days(suggest.sinceLast)}d ago`
              );
            }
            console.log(
              held.length
                ? `unchanged repeat — silent: ${held.join("; ")}`
                : "nothing changed, nothing missed, nothing to suggest — silent"
            );
          }

          // An emptied set resets, so the same set coming back later is
          // reported in full at once.
          const nextState = {
            miss_hash: missHash,
            keys: missedKeys,
            miss_since: missSince,
            last_notified: missChanged ? now : missHash === null ? null : (state.last_notified ?? null),
            suggest_keys: Array.isArray(state.suggest_keys) ? state.suggest_keys : [],
            suggest_notified: state.suggest_notified ?? null,
          };

          // Only a suggestion set that was actually reported moves its clock.
          if (suggestKeys.length === 0) {
            nextState.suggest_keys = [];
            nextState.suggest_notified = null;
          } else if (!suggest.suppress) {
            nextState.suggest_keys = suggestKeys;
            nextState.suggest_notified = now;
          }

          writeFileSync(STATE, JSON.stringify(nextState, null, 2));

          // The cache key carries the hash, so the Actions cache list shows
          // which MISS set each saved state belongs to.
          if (process.env.GITHUB_OUTPUT) {
            appendFileSync(process.env.GITHUB_OUTPUT, `miss_hash=${missHash ?? "none"}\n`);
          }
          NODE

      # Telegram being down must not fail the job: the sync itself already
      # succeeded, and a red run would then send tomorrow's alert chasing a
      # problem that does not exist.
      - name: Notify on change
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          [ -f tg-message.txt ] || exit 0
          # text@file: curl reads and urlencodes the file, so newlines and
          # bullets survive without any shell quoting.
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text@tg-message.txt" >/dev/null || true

      - name: Save reminder state
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .miss-state.json
          key: miss-state-${{ steps.notify.outputs.miss_hash }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Only fires when the job failed — a silent broken cron is the whole
      # thing we are trying to avoid. Carries the failing step and the tail of
      # its output so the message answers "why" on its own.
      - name: Alert on failure
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          step=$(cat failed-step.txt 2>/dev/null || true)
          {
            echo "llm-data webflow-sync FAILED"
            echo "step: ${step:-unknown}"
            if [ -s step.log ]; then
              echo "--- last 15 lines ---"
              # 1500 bytes keeps header + log + link well inside the 4000-char
              # budget. iconv -c drops the half character tail may leave.
              tail -n 15 step.log | tail -c 1500 | iconv -f utf-8 -t utf-8 -c
            else
              echo "(no output captured)"
            fi
            echo "${RUN_URL}"
          } > tg-alert.txt
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text@tg-alert.txt" >/dev/null || true
