name: snapshot

on:
  schedule:
    # 06:15 UTC daily. Off-the-hour on purpose — scheduled jobs at :00 sit in
    # a long queue on GitHub's shared runners.
    - cron: "15 6 * * *"
    # Second attempt. The dataset-server sometimes reindexes for longer than
    # the in-process retries cover; a run that finds no change is a no-op.
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch and normalize
        id: snap
        run: node src/snapshot.js

      - name: Commit
        id: commit
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "llm-data bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "data: snapshot $(date -u +%F)"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Only fires when the job failed — a silent broken cron is the whole
      # thing we are trying to avoid.
      - name: Alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="llm-data snapshot FAILED — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null

      - name: Notify on change
        if: steps.commit.outputs.committed == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="llm-data: new snapshot committed. ${{ steps.snap.outputs.summary }}" >/dev/null
